name: Jottre
options:
  bundleIdPrefix: com.edenkim
  deploymentTarget:
    iOS: "18.0"
  knownRegions:
    - en
    - de
    - af
    - ar
    - es
    - fr
    - hi
    - id
    - it
    - ja
    - ko
    - ms
    - nl
    - pl
    - pt-BR
    - pt-PT
    - ru
    - sv
    - th
    - tr
    - uk
    - vi

settings:
  base:
    DEVELOPMENT_TEAM: VKZ635AGJ6

targets:
  Jottre:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jottre Jot
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.edenkim.jottre.jot
        LSApplicationQueriesSchemes:
          - shareddocuments
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.edenkim.jottre.jot
            UTTypeDescription: Jottre Jot
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - jot
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSQuitAlwaysKeepsWindows: true
        NSUserActivityTypes:
          - com.edenkim.jottre.openJot
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    entitlements:
      path: Jottre.entitlements
      properties:
        com.apple.security.files.user-selected.read-write: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edenkim.jottre
        PRODUCT_NAME: Jottre
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        VALIDATE_PRODUCT: YES
    packages: []

  JottreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CoreTests
      - path: Tests/Resources
        buildPhase: resources
    dependencies:
      - target: Jottre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edenkim.jottre.JottreTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Jottre:
    build:
      targets:
        Jottre: all
    run:
      config: Debug
      executable: Jottre
    test:
      config: Debug
      targets:
        - name: JottreTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug

  JottreTests:
    build:
      targets:
        JottreTests: all
        Jottre: all
    test:
      config: Debug
      targets:
        - name: JottreTests
    analyze:
      config: Debug
